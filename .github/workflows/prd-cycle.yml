name: prd-cycle

# Daily backlog replenishment. Fallback/alternative to the Cursor Automation
# in docs/automations/prd-cycle.md. No-ops until CURSOR_API_KEY is set.
# Empty / no-delta filing is forbidden — see the prompt contract.

on:
  schedule:
    # Daily 14:00 UTC / 7:00 PT — keep the auto-dev backlog stocked.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: prd-cycle
  cancel-in-progress: false

jobs:
  prd-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for API key
        id: gate
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CURSOR_API_KEY secret not set — skipping prd cycle."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          token: ${{ secrets.AUTODEV_GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        if: steps.gate.outputs.enabled == 'true'
        run: pip install -e ".[dev]"

      - name: Install Cursor CLI
        if: steps.gate.outputs.enabled == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run PRD cycle
        if: steps.gate.outputs.enabled == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.AUTODEV_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "daari-autodev"
          git config user.email "autodev@users.noreply.github.com"
          cursor-agent --print --force \
            "You are the product lead for naveenreddyalka/daari. Follow docs/automations/prd-cycle.md and AGENTS.md hard limits exactly. Never file zero issues (no-delta is forbidden). Always file 3-5 auto-dev issues: new features if they exist, otherwise improvements to performance, usability, testability, benchmarking, documentation, tooling, or tech debt. First body line must be Intended labels. Update docs/prd/ENTERPRISE.md on branch prd/<date> and open an auto-merging PR. Do not write feature code. Do not mention other open issue numbers in the PR title or body (picker hides mentioned issues). Hard limits: no tags, no releases, no force-push, no new runtime dependencies, no edits under .github/workflows/ unless an issue explicitly requires them."
