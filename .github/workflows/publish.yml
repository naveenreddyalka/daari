name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Publish target (pypi or testpypi)"
        required: true
        default: "pypi"
        type: choice
        options:
          - pypi
          - testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution artifacts
        run: |
          # twine <7 rejects the Metadata-Version 2.5 that current hatchling
          # emits, which fails the release rather than the build that produced it.
          python -m pip install --upgrade pip build "twine>=7"
          python -m build
          twine check --strict dist/*

      - name: Smoke-test wheel install
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl
          /tmp/wheel-test/bin/daari --help

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment: pypi
    if: ${{ github.event_name == 'release' || github.event.inputs.repository == 'pypi' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  formula:
    # The tarball hash only exists once the release does, so this cannot run
    # earlier. Opens a PR rather than pushing, since Formula/daari.rb is reviewed.
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate formula hash and resources
        run: python scripts/update_formula.py --version "${GITHUB_REF_NAME#v}"

      - name: Open a PR if the formula changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if git diff --quiet Formula/daari.rb; then
            echo "Formula already current for ${VERSION}"
            exit 0
          fi
          BRANCH="chore/formula-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/daari.rb
          git commit -m "chore(brew): update formula for ${VERSION}"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(brew): update formula for ${VERSION}" \
            --body "Generated by \`scripts/update_formula.py\` after the ${VERSION} release. Tarball sha256 and dependency resources refreshed."

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment: testpypi
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.repository == 'testpypi' }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
