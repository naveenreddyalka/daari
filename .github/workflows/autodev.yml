name: autodev-cycle

# Fallback/alternative to the Cursor Automation in docs/automations/dev-cycle.md.
# No-ops until the CURSOR_API_KEY repo secret is set.
# Disable by removing the schedule block or deleting the CURSOR_API_KEY secret.

on:
  schedule:
    # Every 3h. Each run drains issues back-to-back for ~50 min, then exits
    # cleanly before timeout-minutes (see AUTODEV_DEADLINE_EPOCH). If the pick
    # is empty, refill 3–5 issues (prd-cycle.md) then implement — never idle.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: autodev-cycle
  cancel-in-progress: false

jobs:
  stall-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTODEV_GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Flag stalled auto-merge PRs
        env:
          GH_TOKEN: ${{ secrets.AUTODEV_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/autodev_pr_watch.py --apply --min-age-minutes 15

  dev-cycle:
    runs-on: ubuntu-latest
    # The agent stops picking new issues at the 50-min deadline below; the
    # extra 10 min lets the final PR's auto-merge settle without a kill.
    timeout-minutes: 60
    steps:
      - name: Check for API key
        id: gate
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CURSOR_API_KEY secret not set — skipping autodev cycle."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          token: ${{ secrets.AUTODEV_GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        if: steps.gate.outputs.enabled == 'true'
        run: pip install -e ".[dev]"

      - name: Install Cursor CLI
        if: steps.gate.outputs.enabled == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Run dev cycle
        if: steps.gate.outputs.enabled == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ secrets.AUTODEV_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "daari-autodev"
          git config user.email "autodev@users.noreply.github.com"
          # Wall-clock budget for picking new issues: 50 min from now, 10 min
          # inside timeout-minutes so the last auto-merge is never killed.
          export AUTODEV_DEADLINE_EPOCH=$(( $(date +%s) + 50 * 60 ))
          echo "AUTODEV_DEADLINE_EPOCH=$AUTODEV_DEADLINE_EPOCH ($(date -u -d @"$AUTODEV_DEADLINE_EPOCH" +%H:%MZ))"
          cursor-agent --print --force \
            "You are working in the current checkout of naveenreddyalka/daari. Read AGENTS.md and follow it exactly. Drain first: before picking anything, list open PRs on autodev/* branches with auto-merge enabled (gh pr list --state open --json number,headRefName,mergeStateStatus,mergeable,autoMergeRequest,labels). Handle them in issue priority order (P1 before P2 before P3, then oldest). For a PR that is BEHIND or BLOCKED with green checks: run gh pr update-branch <n>, wait for the test check to pass (gh pr checks <n> --watch), then merge it yourself with gh pr merge <n> --squash — do not rely on auto-merge, main moves too fast for it. For a PR that is DIRTY (mergeable CONFLICTING): git fetch, check out the branch, merge origin/main, resolve conflicts (for docs/TRACKING.md keep both ### sections), run pytest -m 'not integration and not benchmark' -q until green, push, then update-branch/merge as above. If a PR's tests are genuinely red or it cannot be resolved in 15 minutes, comment findings on the PR and move on. Only after the drain is empty, loop: pick the highest-priority open GitHub issue labeled auto-dev without the agent:working label and no open linked PR: run python scripts/autodev_backlog.py --pick (it reads the GraphQL repository connection because gh issue list depends on GitHub's stale-prone search index). If it prints 'backlog empty', do not stop — follow docs/automations/prd-cycle.md and refill: file 3-5 new auto-dev issues (new features or improvements to performance, usability, testability, benchmarking, documentation, tooling, tech debt; first body line Intended labels). Then run --pick again and implement the winner. Never print backlog empty and stop. Add agent:working to the picked issue, create branch autodev/<issue-number>-<slug> from latest origin/main, implement the issue TDD-style honoring its acceptance criteria, run pytest -m 'not integration and not benchmark' -q until green, update docs/TRACKING.md when relevant (append a new ### section above ## How to update; on conflict keep both sections), commit with a conventional message, fetch+merge origin/main if behind, push the branch, open a PR whose body contains 'Closes #<issue>', run gh pr merge --auto --squash, then check mergeStateStatus — if DIRTY, merge origin/main, resolve, push. Then remove the agent:working label and go back to the top of the loop. Time box: this job has a hard deadline at unix epoch $AUTODEV_DEADLINE_EPOCH (also in env var AUTODEV_DEADLINE_EPOCH). Before every pick, run date +%s and compare: if fewer than 600 seconds remain, do not pick another issue — make sure the current PR has auto-merge enabled and agent:working removed, print 'time box reached', and exit 0 cleanly. Never start an issue you cannot finish before the deadline; a half-done issue must be left with no agent:working label and a comment on the issue. If blocked, comment findings on the issue and remove agent:working. Hard limits: no tags, no releases, no force-push, no new runtime dependencies, no edits under .github/workflows/ unless the issue explicitly requires them."
