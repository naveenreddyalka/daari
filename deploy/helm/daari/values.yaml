# Default: single replica until Postgres is enabled. Raising replicaCount or
# autoscaling.minReplicas above 1 without postgres.enabled leaves batches, files,
# and the usage ledger on per-pod SQLite (404 / split-brain across replicas).
# See templates/NOTES.txt and docs/developer/guides/operations/capacity-helm.md.
replicaCount: 1

image:
  repository: ghcr.io/naveenreddyalka/daari
  # Keep in sync with Chart.yaml appVersion and daari.__version__ (see capacity-helm.md).
  tag: "1.4.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 11435

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# HPA: scale on CPU. Optional KEDA ScaledObject (autoscaling.keda) scales on
# sum(rate(daari_requests_total[1m])). Off unless the cluster already has KEDA
# and Prometheus. Keep minReplicas / keda.minReplicaCount at 1 unless
# postgres.enabled is true (shared batches/files/ledger).
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  keda:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 10
    # kube-prometheus default; override to the in-cluster Prometheus service.
    serverAddress: http://prometheus-operated.monitoring.svc:9090
    query: sum(rate(daari_requests_total[1m]))
    # Target requests/sec for the query above (KEDA desired = metric / threshold).
    threshold: "50"

# Readiness uses /ready (checks model backend). Liveness uses /health.
probes:
  readinessPath: /ready
  livenessPath: /health

# Graceful rollout / drain (#545). Size terminationGracePeriodSeconds above the
# longest SSE stream you expect (and sse_keepalive_seconds). preStop sleeps so
# Service endpoint removal propagates before SIGTERM; 0 omits the lifecycle block.
terminationGracePeriodSeconds: 60
lifecycle:
  preStopSleepSeconds: 5

# Zero-downtime rolling updates: never drop capacity during upgrades.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Pod / container hardening (#554). Image runs as uid 1000 (`USER daari`).
# readOnlyRootFilesystem needs the emptyDir mounts below for ~/.daari and /tmp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Voluntary disruption floor during node drains / voluntary evictions.
# Enable for multi-replica fleets; with replicaCount=1 prefer maxUnavailable: 1
# over minAvailable: 1 (the latter blocks draining the only pod).
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# Prometheus Operator ServiceMonitor for GET /metrics.
# Default endpoint is the API `http` Service port (may need bearerTokenSecret
# when server.api_key protects /metrics). When observability.metricsPort > 0,
# the monitor scrapes the dedicated `metrics` port instead (no Bearer —
# scrape-only listener, keep off public ingress).
# Requires the monitoring.coreos.com CRDs (kube-prometheus / prometheus-operator).
# Chart env already sets DAARI_OBSERVABILITY__PROMETHEUS=true.
serviceMonitor:
  enabled: false
  # Extra labels for operator release selectors, e.g. release: kube-prometheus-stack
  labels: {}
  # Optional: { name, key } — used only when scraping the API http port.
  bearerTokenSecret: {}

# Optional private Prometheus scrape listener (app observability.metrics_port).
# 0 / unset = off (scrape API port /metrics). Non-zero binds 127.0.0.1-style
# scrape-only /metrics without inference API key auth — wire containerPort +
# Service port `metrics` and prefer ServiceMonitor → metrics (no bearer).
observability:
  metricsPort: 0
  # Days to keep gateway request-log lines (#786). Empty leaves the app default
  # (0 = size-only rotation via request_log_max_bytes).
  retention:
    requestLogDays: ""

# External Redis for L0/L1 when cache.backend=redis (issue #112).
redis:
  enabled: false
  url: redis://redis:6379/0

# External Postgres for ledger/traces/batches/files (issues #116, #465).
# When enabled, the Deployment sets DAARI_OBSERVABILITY__BACKEND,
# DAARI_BATCHES__BACKEND, DAARI_FILES__BACKEND, and DAARI_RESPONSES__BACKEND
# to postgres (shared fleet).
# Example multi-replica fleet:
#   replicaCount: 2
#   autoscaling.minReplicas: 2
#   postgres:
#     enabled: true
#     url: postgresql://daari:daari@postgres:5432/daari
postgres:
  enabled: false
  url: ""

# Point tiers at an org GPU pool (Ollama/vLLM) instead of sidecar Ollama.
orgPool:
  enabled: false
  baseUrl: ""

# Master API key from an existing Secret (multi-replica auth). Empty = unset
# (open local install). Example: { name: daari-master, key: api-key }
server:
  apiKeySecret: {}

# Global RPM/TPM caps (#842). When enabled with redis.enabled (or rateLimit.redisUrl),
# fleet counters share Redis via cache.backend=redis. Without Redis, limits are
# per-pod SQLite only — fine for replicaCount=1.
rateLimit:
  enabled: false
  rpm: 0
  tpm: 0
  modelRpm: 0
  modelTpm: 0
  # Used only when redis.enabled=false; otherwise cache Redis is reused.
  redisUrl: ""

# L6 frontier fallback. apiKeySecret mounts DAARI_FRONTIER_API_KEY
# (also accepted: OPENAI_API_KEY / OPENROUTER_API_KEY via env).
frontier:
  enabled: false
  apiKeySecret: {}

# When every local-pool host is down, escalate chat to L6 (#846 / #887).
# Requires frontier.enabled (+ API key). Default false omits the env var.
localPool:
  frontierFallback: false

# Embedder base URL for POST /v1/embeddings and L1. Empty leaves the image
# default (localhost). Distinct from orgPool, which only sets the routing URL.
ollama:
  baseUrl: ""

# Local OpenAI-compatible speech-to-text (vLLM, whisper.cpp). Empty leaves
# POST /v1/audio/transcriptions unconfigured (501) instead of a cloud ASR API.
asr:
  baseUrl: ""

# Wall-clock budget across cache/local/frontier hops (#786 / #771). Empty =
# per-tier timeouts only; X-Daari-Deadline-Ms still overrides when set.
upstream:
  requestDeadlineSeconds: ""

env:
  DAARI_SERVER__HOST: "0.0.0.0"
  DAARI_OBSERVABILITY__PROMETHEUS: "true"

# Capacity guidance (see docs/setup/capacity.md):
# ~50–100 req/s per replica for cache-heavy traffic; Redis ~1–2KB/entry.
