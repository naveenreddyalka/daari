# Default: single replica until Postgres is enabled. Raising replicaCount or
# autoscaling.minReplicas above 1 without postgres.enabled leaves batches, files,
# and the usage ledger on per-pod SQLite (404 / split-brain across replicas).
# See templates/NOTES.txt and docs/developer/guides/operations/capacity-helm.md.
replicaCount: 1

image:
  repository: ghcr.io/naveenreddyalka/daari
  # Keep in sync with Chart.yaml appVersion and daari.__version__ (see capacity-helm.md).
  tag: "1.4.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 11435

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# HPA: scale on CPU. For request-rate, wire KEDA externally.
# Keep minReplicas at 1 unless postgres.enabled is true (shared batches/files/ledger).
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# Readiness uses /ready (checks model backend). Liveness uses /health.
probes:
  readinessPath: /ready
  livenessPath: /health

# Graceful rollout / drain (#545). Size terminationGracePeriodSeconds above the
# longest SSE stream you expect (and sse_keepalive_seconds). preStop sleeps so
# Service endpoint removal propagates before SIGTERM; 0 omits the lifecycle block.
terminationGracePeriodSeconds: 60
lifecycle:
  preStopSleepSeconds: 5

# Zero-downtime rolling updates: never drop capacity during upgrades.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Pod / container hardening (#554). Image runs as uid 1000 (`USER daari`).
# readOnlyRootFilesystem needs the emptyDir mounts below for ~/.daari and /tmp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Voluntary disruption floor during node drains / voluntary evictions.
# Enable for multi-replica fleets; with replicaCount=1 prefer maxUnavailable: 1
# over minAvailable: 1 (the latter blocks draining the only pod).
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# External Redis for L0/L1 when cache.backend=redis (issue #112).
redis:
  enabled: false
  url: redis://redis:6379/0

# External Postgres for ledger/traces/batches/files (issues #116, #465).
# When enabled, the Deployment sets DAARI_OBSERVABILITY__BACKEND,
# DAARI_BATCHES__BACKEND, DAARI_FILES__BACKEND, and DAARI_RESPONSES__BACKEND
# to postgres (shared fleet).
# Example multi-replica fleet:
#   replicaCount: 2
#   autoscaling.minReplicas: 2
#   postgres:
#     enabled: true
#     url: postgresql://daari:daari@postgres:5432/daari
postgres:
  enabled: false
  url: ""

# Point tiers at an org GPU pool (Ollama/vLLM) instead of sidecar Ollama.
orgPool:
  enabled: false
  baseUrl: ""

env:
  DAARI_SERVER__HOST: "0.0.0.0"
  DAARI_OBSERVABILITY__PROMETHEUS: "true"

# Capacity guidance (see docs/setup/capacity.md):
# ~50–100 req/s per replica for cache-heavy traffic; Redis ~1–2KB/entry.
