# Default: single replica until Postgres is enabled. Raising replicaCount or
# autoscaling.minReplicas above 1 without postgres.enabled leaves batches, files,
# and the usage ledger on per-pod SQLite (404 / split-brain across replicas).
# See templates/NOTES.txt and docs/developer/guides/operations/capacity-helm.md.
replicaCount: 1

image:
  repository: ghcr.io/naveenreddyalka/daari
  # Keep in sync with Chart.yaml appVersion and daari.__version__ (see capacity-helm.md).
  tag: "1.4.0"
  # Optional immutable pin (e.g. sha256:…). When set, Deployment + backup CronJob
  # use repository@digest and ignore tag. Verify with cosign (docs/RELEASING.md).
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 11435

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# HPA: scale on CPU. Optional KEDA ScaledObject (autoscaling.keda) scales on
# sum(rate(daari_requests_total[1m])). Off unless the cluster already has KEDA
# and Prometheus. Keep minReplicas / keda.minReplicaCount at 1 unless
# postgres.enabled is true (shared batches/files/ledger).
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  keda:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 10
    # kube-prometheus default; override to the in-cluster Prometheus service.
    serverAddress: http://prometheus-operated.monitoring.svc:9090
    query: sum(rate(daari_requests_total[1m]))
    # Target requests/sec for the query above (KEDA desired = metric / threshold).
    threshold: "50"

# Readiness uses /ready (checks model backend). Liveness uses /health.
probes:
  readinessPath: /ready
  livenessPath: /health

# Graceful rollout / drain (#545 / #1104). App-level drain flips /ready to
# shutting_down and stops new admission on SIGTERM; uvicorn
# timeout_graceful_shutdown uses gracefulTimeoutSeconds. Keep
# terminationGracePeriodSeconds > gracefulTimeoutSeconds + preStopSleepSeconds.
gracefulTimeoutSeconds: 30
terminationGracePeriodSeconds: 60
lifecycle:
  preStopSleepSeconds: 5

# Zero-downtime rolling updates: never drop capacity during upgrades.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Pod / container hardening (#554). Image runs as uid 1000 (`USER daari`).
# readOnlyRootFilesystem needs the emptyDir mounts below for ~/.daari and /tmp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Voluntary disruption floor during node drains / voluntary evictions.
# Enable for multi-replica fleets; with replicaCount=1 prefer maxUnavailable: 1
# over minAvailable: 1 (the latter blocks draining the only pod).
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# NetworkPolicy (#1591 / #1613). Off by default (open cluster networking). When
# enabled, ingress is limited to networkPolicy.ingress.from plus Prometheus
# scrape peers when serviceMonitor.enabled (default: namespace
# kubernetes.io/metadata.name=monitoring). Egress allows DNS, Redis/Postgres
# ports when those backends are enabled OR external URLs are set
# (rateLimit.redisUrl / postgres.url), HTTPS when frontier.enabled, and
# common local-inference ports when ollama/orgPool/asr/tts are configured.
# Append full rules via ingress.extra / egress.extra / extraEgress.
networkPolicy:
  enabled: false
  ingress:
    from: []
    # Override auto Prometheus peers (used only when serviceMonitor.enabled).
    # Empty list uses the monitoring-namespace default above.
    prometheusFrom: []
    extra: []
  egress:
    dns: true
    redis: true
    postgres: true
    frontierHTTPS: true
    localBackends: true
    extra: []
  # Top-level egress rules rendered verbatim (CIDR/port peers for managed DBs).
  extraEgress: []

# Scheduling pass-through (#1591 / #1613). Empty defaults keep the Deployment
# byte-identical to charts without these knobs.
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
nodeSelector: {}
tolerations: []
initContainers: []
# Raw env entries (supports valueFrom / secretKeyRef). Appended after env map.
extraEnv: []

# Prometheus Operator ServiceMonitor for GET /metrics.
# Default endpoint is the API `http` Service port (may need bearerTokenSecret
# when server.api_key protects /metrics). When observability.metricsPort > 0,
# the monitor scrapes the dedicated `metrics` port instead (no Bearer —
# scrape-only listener, keep off public ingress).
# Requires the monitoring.coreos.com CRDs (kube-prometheus / prometheus-operator).
# Chart env already sets DAARI_OBSERVABILITY__PROMETHEUS=true.
serviceMonitor:
  enabled: false
  # Extra labels for operator release selectors, e.g. release: kube-prometheus-stack
  labels: {}
  # Optional: { name, key } — used only when scraping the API http port.
  bearerTokenSecret: {}

# Opt-in Grafana overview dashboard ConfigMap (#1636). Embeds
# files/grafana/daari-dashboard.json (mirrors deploy/grafana/). Default labels
# suit the grafana-sidecar / kube-prometheus-stack dashboard importer.
grafanaDashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
  annotations: {}

# Prometheus Operator PrometheusRule alert pack (#1630). Opt-in; requires the
# same monitoring.coreos.com CRDs as serviceMonitor. Metric names match
# daari/observability/prometheus.py. See metrics-prometheus.md#alert-pack.
prometheusRules:
  enabled: false
  # Extra labels for operator/Alertmanager selectors.
  labels: {}
  backend:
    enabled: true
    for: 5m
    severity: critical
  budget:
    enabled: true
    # Alert when remaining_usd / limit_usd is below this fraction.
    fraction: 0.1
    for: 10m
    severity: warning
  errors:
    enabled: true
    window: 5m
    rateThreshold: 0.05
    for: 5m
    severity: critical
  queue:
    enabled: true
    threshold: 10
    for: 5m
    severity: warning
  guardrails:
    enabled: true
    window: 5m
    rateThreshold: 1
    for: 5m
    severity: warning
  keys:
    enabled: true
    for: 1h
    severity: warning
  # Elevated admin cache-invalidate errors (#1660).
  cacheInvalidate:
    enabled: true
    window: 5m
    rateThreshold: 0.05
    for: 5m
    severity: warning
  # Local SQLite schema lag (#1823) — same signal as /ready schema_ok false.
  schema:
    enabled: true
    for: 5m
    severity: critical
  # Sustained systemone breaker open/reject rate (#1823).
  systemoneBreaker:
    enabled: true
    window: 5m
    rateThreshold: 0.05
    for: 5m
    severity: warning
  # Any fleet breaker open for >5m (#1932).
  fleetBreakerOpen:
    enabled: true
    for: 5m
    severity: warning
  # OpenAI service_tier degrade soft-warnings (#1889).
  serviceTierDegraded:
    enabled: true
    window: 5m
    rateThreshold: 0.01
    for: 10m
    severity: warning
  # Anthropic dead sampling knobs stripped (#1889).
  anthropicSamplingStripped:
    enabled: true
    window: 5m
    rateThreshold: 0
    for: 5m
    severity: warning
  # Anthropic document blocks stripped under 2026-10-21 (#1917).
  anthropicDocumentStripped:
    enabled: true
    window: 5m
    rateThreshold: 0
    for: 5m
    severity: warning
  # Anthropic citation metadata stripped under 2026-10-21 (#1917).
  anthropicCitationsStripped:
    enabled: true
    window: 5m
    rateThreshold: 0
    for: 5m
    severity: warning
  # Mapped users under Anthropic org enforcement (#1889).
  anthropicEnforcedProfiles:
    enabled: true
    threshold: 0
    for: 5m
    severity: critical
  # Responses completion webhook delivery errors (#1935).
  responsesWebhooksErrors:
    enabled: true
    window: 5m
    rateThreshold: 0.01
    for: 5m
    severity: warning
  # Anthropic org enforcement webhook ingest errors (#1935).
  orgEnforcementWebhooksErrors:
    enabled: true
    window: 5m
    rateThreshold: 0.01
    for: 5m
    severity: warning

# Optional private Prometheus scrape listener (app observability.metrics_port).
# 0 / unset = off (scrape API port /metrics). Non-zero binds 127.0.0.1-style
# scrape-only /metrics without inference API key auth — wire containerPort +
# Service port `metrics` and prefer ServiceMonitor → metrics (no bearer).
observability:
  metricsPort: 0
  # Opt-in OTLP log export (#849 / #888). Pair with otlpEndpoint (or set
  # OTEL_EXPORTER_OTLP_ENDPOINT yourself). See otel-genai.md.
  otlpLogs: false
  otlpEndpoint: ""
  # Gateway request/event log backend (#1631). Empty leaves app default
  # (jsonl). When postgres.enabled, Deployment forces postgres.
  requestLog:
    backend: ""
  # Days to keep gateway request-log lines (#786). Empty leaves the app default
  # (0 = size-only rotation via request_log_max_bytes).
  retention:
    requestLogDays: ""

# External Redis for L0/L1 when cache.backend=redis (issue #112).
# In-cluster redis://host is fine on a private CNI; for managed/remote Redis
# use rediss:// and optionally ?ssl_ca_certs=/path/to/ca.pem (#1679).
# Example TLS:
#   redis:
#     enabled: true
#     url: rediss://:PASSWORD@redis.example:6380/0?ssl_ca_certs=/etc/ssl/certs/ca.pem
redis:
  enabled: false
  url: redis://redis:6379/0

# External Postgres for ledger/traces/batches/files (issues #116, #465, #1631).
# When enabled, the Deployment sets DAARI_OBSERVABILITY__BACKEND,
# DAARI_OBSERVABILITY__REQUEST_LOG__BACKEND, DAARI_BATCHES__BACKEND,
# DAARI_FILES__BACKEND, and DAARI_RESPONSES__BACKEND to postgres (shared fleet).
# Example multi-replica fleet:
#   replicaCount: 2
#   autoscaling.minReplicas: 2
#   postgres:
#     enabled: true
#     url: postgresql://daari:daari@postgres:5432/daari
# Remote/managed Postgres should set sslmode=require (or verify-ca /
# verify-full) and optionally sslrootcert (#1679):
#   postgres:
#     enabled: true
#     url: postgresql://daari:daari@db.example:5432/daari?sslmode=require&sslrootcert=/etc/ssl/certs/ca.pem
postgres:
  enabled: false
  url: ""

# Point tiers at an org GPU pool (Ollama/vLLM) instead of sidecar Ollama.
orgPool:
  enabled: false
  baseUrl: ""

# Sticky sessions across tool continuations (#1178). Pins are per-process
# unless redis.enabled (cache.backend=redis). Doctor warns when affinity is
# on without Redis. Default false omits the env vars.
routing:
  sessionAffinity: false
  # Pin / cost-rollup TTL in seconds (Settings session_affinity_ttl_seconds).
  # Only emitted when sessionAffinity is true.
  sessionAffinityTtlSeconds: 1800

# Periodic signed org-config refresh (#1178). Empty url omits env.
# signingSecret mounts DAARI_ENTERPRISE__CONFIG_SIGNING_SECRET for HMAC
# verification of X-Daari-Signature (enterprise.config_signing_secret).
enterprise:
  policySync:
    url: ""
    signingSecret: {}

# Master API key from an existing Secret (multi-replica auth). Empty = unset
# (open local install). Example: { name: daari-master, key: api-key }
server:
  apiKeySecret: {}
  # Browser Origin allowlist for CORS (#938). Empty = no CORS middleware.
  # Example: ["http://127.0.0.1:11437"] for daari web-ui serve.
  corsOrigins: []
  # Baseline X-Content-Type-Options / X-Frame-Options / Referrer-Policy.
  securityHeaders:
    enabled: true
  # Pre-auth header screen (#1205 / server.header_policy). Default disabled
  # omits the env vars. When enabled, mounts DAARI_SERVER__HEADER_POLICY__*
  # (required / deny / allow as JSON) so fleet installs can turn on Portkey-
  # style startHooks screening from values.
  headerPolicy:
    enabled: false
    required: []
    # deny entries: { header, exact? , regex? }
    deny: []
    # allow: map of header name → list of permitted values
    allow: {}

# Native TLS / optional mTLS for the container (#932). When enabled, mounts
# tls.existingSecret at /etc/daari/tls (expects tls.crt + tls.key; optional
# ca.crt for client mTLS) and sets DAARI_SERVER__TLS__* so uvicorn serves
# HTTPS. Probes switch to scheme HTTPS. Prefer ingress TLS termination when
# the cluster already has a cert-manager / ingress controller.
tls:
  enabled: false
  existingSecret: ""
  certFile: /etc/daari/tls/tls.crt
  keyFile: /etc/daari/tls/tls.key
  # Empty omits DAARI_SERVER__TLS__CLIENT_CA (no mTLS).
  clientCAFile: ""

# Per-server MCP egress ceilings (#1659 / #1620). Rendered as
# DAARI_INTEGRATIONS__MCP_SERVERS JSON when non-empty. Each entry needs id + url;
# optional rpm/tpm (0 = unlimited), token, triggers. Chart install can set
# ceilings without hand-editing config.yaml on every pod.
# Example:
#   integrations:
#     mcpServers:
#       - id: tools
#         url: http://mcp-tools:8080/mcp
#         rpm: 60
#         tpm: 100000
integrations:
  mcpServers: []

# Global RPM/TPM caps (#842). When enabled with redis.enabled (or rateLimit.redisUrl),
# fleet counters share Redis via cache.backend=redis. Without Redis, limits are
# per-pod SQLite only — fine for replicaCount=1.
rateLimit:
  enabled: false
  rpm: 0
  tpm: 0
  modelRpm: 0
  modelTpm: 0
  # Global in-flight concurrency cap (0 = unlimited). Env: DAARI_RATE_LIMIT__MAX_IN_FLIGHT.
  maxInFlight: 0
  # Named per-model-id overrides (rpm/tpm/max_in_flight). Rendered as JSON env.
  # Example: { llama3-70b: { rpm: 10, tpm: 20000, max_in_flight: 2 } }
  models: {}
  # Used only when redis.enabled=false; otherwise cache Redis is reused.
  redisUrl: ""

# L6 frontier fallback. apiKeySecret mounts DAARI_FRONTIER_API_KEY
# (also accepted: OPENAI_API_KEY / OPENROUTER_API_KEY via env).
# Also serves POST /v1/decisions for gpt-6-luna (typed judgments) when the
# client model is the frontier decisions id — same key as chat L6.
frontier:
  enabled: false
  apiKeySecret: {}

# When every local-pool host is down, escalate chat to L6 (#846 / #887).
# Requires frontier.enabled (+ API key). Default false omits the env var.
localPool:
  frontierFallback: false

# Embedder base URL for POST /v1/embeddings and L1. Empty leaves the image
# default (localhost). Distinct from orgPool, which only sets the routing URL.
# Local POST /v1/decisions models also fall back to this Ollama root when
# systemone.baseUrl is empty.
ollama:
  baseUrl: ""

# Decision-model upstream for POST /v1/systemone, local /v1/decisions,
# guardrail predicates, and the decision classifier. Empty baseUrl keeps
# the Ollama fallback (ollama.baseUrl). enabled defaults true (chart omits
# env); set false to mount DAARI_SYSTEMONE__ENABLED=false (501 on the route).
# apiKeySecret mounts DAARI_SYSTEMONE__API_KEY from a k8s Secret ({ name, key })
# for authenticated vLLM / reverse-proxy upstreams. Empty {} omits the env.
systemone:
  enabled: true
  baseUrl: ""
  apiKeySecret: {}

# Local OpenAI-compatible speech-to-text (vLLM, whisper.cpp). Empty leaves
# POST /v1/audio/transcriptions unconfigured (501) instead of a cloud ASR API.
asr:
  baseUrl: ""
  # Optional. When set, replaces the client model so whisper/vLLM always sees
  # its own id (DAARI_ASR__MODEL). Empty omits the env.
  model: ""
  # Opt-in: when true and baseUrl is empty, one transcription may go to frontier.
  # Default false omits DAARI_ASR__FRONTIER_FALLBACK so audio stays on-box.
  frontierFallback: false

# Local OpenAI-compatible text-to-speech (Kokoro/openedai-speech). Empty
# baseUrl leaves POST /v1/audio/speech at 501. model/voice override client
# fields when set (#900).
tts:
  baseUrl: ""
  model: ""
  voice: ""

# Wall-clock budget across cache/local/frontier hops (#786 / #771). Empty =
# per-tier timeouts only; X-Daari-Deadline-Ms still overrides when set.
upstream:
  requestDeadlineSeconds: ""

env:
  DAARI_SERVER__HOST: "0.0.0.0"
  DAARI_OBSERVABILITY__PROMETHEUS: "true"

# Scheduled encrypted backups (#1216). Off by default. When enabled, a CronJob
# runs `daari backup create` into a PVC (or emptyDir) on `backup.schedule`.
# backup.consistent null passes --consistent when postgres.enabled (#1705).
# encrypt: "" (plaintext), openssl, or age. openssl/age require encryptSecret:
#   kubectl create secret generic daari-backup \
#     --from-literal=passphrase='…'            # openssl → passphraseKey
#     --from-literal=ageRecipient='age1…'     # age → ageRecipientKey
# retain: keep the newest N archives (0 = no prune).
backup:
  enabled: false
  schedule: "0 2 * * *"
  # null: --consistent when postgres.enabled; set false for the fast path.
  consistent: null
  encrypt: openssl
  retain: 7
  passphraseEnv: DAARI_BACKUP_PASS
  encryptSecret:
    name: ""
    passphraseKey: passphrase
    ageRecipientKey: ageRecipient
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    existingClaim: ""
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

# Capacity guidance (see docs/setup/capacity.md):
# ~50–100 req/s per replica for cache-heavy traffic; Redis ~1–2KB/entry.
