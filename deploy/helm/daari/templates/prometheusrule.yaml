{{- if .Values.prometheusRules.enabled }}
{{- $pr := .Values.prometheusRules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "daari.fullname" . }}
  labels:
    app.kubernetes.io/name: daari
    {{- with $pr.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: daari.alerts
      rules:
        {{- if ($pr.backend).enabled | default true }}
        - alert: DaariBackendDown
          expr: daari_backend_up == 0
          for: {{ ($pr.backend).for | default "5m" }}
          labels:
            severity: {{ ($pr.backend).severity | default "critical" | quote }}
          annotations:
            summary: "daari backend unhealthy or circuit open"
            description: "Backend {{`{{ $labels.backend }}`}} reports daari_backend_up=0 (circuit={{`{{ $labels.circuit }}`}})."
            runbook_url: {{ ($pr.backend).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.budget).enabled | default true }}
        - alert: DaariBudgetLow
          expr: |
            (
              daari_team_budget_remaining_usd
              / clamp_min(daari_team_budget_limit_usd, 1e-9)
            ) < {{ ($pr.budget).fraction | default 0.1 }}
          for: {{ ($pr.budget).for | default "10m" }}
          labels:
            severity: {{ ($pr.budget).severity | default "warning" | quote }}
          annotations:
            summary: "daari team budget remaining below fraction"
            description: "Team {{`{{ $labels.team }}`}} window {{`{{ $labels.window }}`}} remaining/limit is below {{ ($pr.budget).fraction | default 0.1 }}."
            runbook_url: {{ ($pr.budget).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.errors).enabled | default true }}
        - alert: DaariErrorRateHigh
          expr: sum(rate(daari_errors_total[{{ ($pr.errors).window | default "5m" }}])) > {{ ($pr.errors).rateThreshold | default 0.05 }}
          for: {{ ($pr.errors).for | default "5m" }}
          labels:
            severity: {{ ($pr.errors).severity | default "critical" | quote }}
          annotations:
            summary: "daari error rate elevated"
            description: "sum(rate(daari_errors_total)) exceeds {{ ($pr.errors).rateThreshold | default 0.05 }} (status-labeled series)."
            runbook_url: {{ ($pr.errors).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.queue).enabled | default true }}
        - alert: DaariAdmissionQueueDeep
          expr: daari_rate_limit_queued > {{ ($pr.queue).threshold | default 10 }}
          for: {{ ($pr.queue).for | default "5m" }}
          labels:
            severity: {{ ($pr.queue).severity | default "warning" | quote }}
          annotations:
            summary: "daari admission queue depth high"
            description: "daari_rate_limit_queued is above {{ ($pr.queue).threshold | default 10 }}."
            runbook_url: {{ ($pr.queue).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.guardrails).enabled | default true }}
        - alert: DaariGuardrailTripSpike
          expr: sum(rate(daari_guardrail_trips_total[{{ ($pr.guardrails).window | default "5m" }}])) > {{ ($pr.guardrails).rateThreshold | default 1 }}
          for: {{ ($pr.guardrails).for | default "5m" }}
          labels:
            severity: {{ ($pr.guardrails).severity | default "warning" | quote }}
          annotations:
            summary: "daari guardrail trips spiking"
            description: "sum(rate(daari_guardrail_trips_total)) exceeds {{ ($pr.guardrails).rateThreshold | default 1 }}."
            runbook_url: {{ ($pr.guardrails).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.keys).enabled | default true }}
        - alert: DaariKeysExpiringSoon
          expr: daari_virtual_keys{status="expiring_soon"} > 0
          for: {{ ($pr.keys).for | default "1h" }}
          labels:
            severity: {{ ($pr.keys).severity | default "warning" | quote }}
          annotations:
            summary: "daari virtual keys expiring soon"
            description: "One or more virtual keys are in status=expiring_soon; rotate before expiry."
            runbook_url: {{ ($pr.keys).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.cacheInvalidate).enabled | default true }}
        - alert: DaariCacheInvalidateErrors
          expr: sum(rate(daari_cache_invalidate_total{result="error"}[{{ ($pr.cacheInvalidate).window | default "5m" }}])) > {{ ($pr.cacheInvalidate).rateThreshold | default 0.05 }}
          for: {{ ($pr.cacheInvalidate).for | default "5m" }}
          labels:
            severity: {{ ($pr.cacheInvalidate).severity | default "warning" | quote }}
          annotations:
            summary: "daari cache invalidate errors elevated"
            description: "sum(rate(daari_cache_invalidate_total{result=\"error\"})) exceeds {{ ($pr.cacheInvalidate).rateThreshold | default 0.05 }}."
            runbook_url: {{ ($pr.cacheInvalidate).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.schema).enabled | default true }}
        - alert: DaariSchemaLagged
          expr: daari_schema_ok == 0
          for: {{ ($pr.schema).for | default "5m" }}
          labels:
            severity: {{ ($pr.schema).severity | default "critical" | quote }}
          annotations:
            summary: "daari local SQLite schema lags the running build"
            description: "daari_schema_ok is 0; a local store is behind STORE_SCHEMA_VERSIONS and /ready returns 503."
            runbook_url: {{ ($pr.schema).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.systemoneBreaker).enabled | default true }}
        - alert: DaariSystemoneBreakerSpike
          expr: sum(rate(daari_systemone_breaker_total{event=~"open|reject"}[{{ ($pr.systemoneBreaker).window | default "5m" }}])) > {{ ($pr.systemoneBreaker).rateThreshold | default 0.05 }}
          for: {{ ($pr.systemoneBreaker).for | default "5m" }}
          labels:
            severity: {{ ($pr.systemoneBreaker).severity | default "warning" | quote }}
          annotations:
            summary: "daari systemone breaker open/reject rate elevated"
            description: "sum(rate(daari_systemone_breaker_total{event=~\"open|reject\"})) exceeds {{ ($pr.systemoneBreaker).rateThreshold | default 0.05 }}."
            runbook_url: {{ ($pr.systemoneBreaker).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.fleetBreakerOpen).enabled | default true }}
        - alert: DaariFleetBreakerOpen
          expr: max(daari_breaker_state) > 0
          for: {{ ($pr.fleetBreakerOpen).for | default "5m" }}
          labels:
            severity: {{ ($pr.fleetBreakerOpen).severity | default "warning" | quote }}
          annotations:
            summary: "daari circuit breaker open for more than 5m"
            description: "daari_breaker_state reports at least one open circuit (frontier, local_pool, mcp_egress, or systemone)."
            runbook_url: {{ ($pr.fleetBreakerOpen).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.serviceTierDegraded).enabled | default true }}
        - alert: DaariServiceTierDegraded
          expr: sum(rate(daari_soft_warnings_total{kind="service_tier_degraded"}[{{ ($pr.serviceTierDegraded).window | default "5m" }}])) > {{ ($pr.serviceTierDegraded).rateThreshold | default 0.01 }}
          for: {{ ($pr.serviceTierDegraded).for | default "10m" }}
          labels:
            severity: {{ ($pr.serviceTierDegraded).severity | default "warning" | quote }}
          annotations:
            summary: "daari OpenAI service_tier degrade rate elevated"
            description: "sum(rate(daari_soft_warnings_total{kind=\"service_tier_degraded\"})) exceeds {{ ($pr.serviceTierDegraded).rateThreshold | default 0.01 }} — provider restricting priority/flex tiers."
            runbook_url: {{ ($pr.serviceTierDegraded).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.anthropicSamplingStripped).enabled | default true }}
        - alert: DaariAnthropicSamplingStripped
          expr: sum(rate(daari_soft_warnings_total{kind="anthropic_sampling_stripped"}[{{ ($pr.anthropicSamplingStripped).window | default "5m" }}])) > {{ ($pr.anthropicSamplingStripped).rateThreshold | default 0 }}
          for: {{ ($pr.anthropicSamplingStripped).for | default "5m" }}
          labels:
            severity: {{ ($pr.anthropicSamplingStripped).severity | default "warning" | quote }}
          annotations:
            summary: "daari Anthropic sampling knobs being stripped"
            description: "sum(rate(daari_soft_warnings_total{kind=\"anthropic_sampling_stripped\"})) exceeds {{ ($pr.anthropicSamplingStripped).rateThreshold | default 0 }} — clients sending dead sampling parameters."
            runbook_url: {{ ($pr.anthropicSamplingStripped).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.anthropicDocumentStripped).enabled | default true }}
        - alert: DaariAnthropicDocumentStripped
          expr: sum(rate(daari_soft_warnings_total{kind="anthropic_document_stripped"}[{{ ($pr.anthropicDocumentStripped).window | default "5m" }}])) > {{ ($pr.anthropicDocumentStripped).rateThreshold | default 0 }}
          for: {{ ($pr.anthropicDocumentStripped).for | default "5m" }}
          labels:
            severity: {{ ($pr.anthropicDocumentStripped).severity | default "warning" | quote }}
          annotations:
            summary: "daari Anthropic document blocks being stripped"
            description: "sum(rate(daari_soft_warnings_total{kind=\"anthropic_document_stripped\"})) exceeds {{ ($pr.anthropicDocumentStripped).rateThreshold | default 0 }} — assistant document blocks dropped under anthropic-version 2026-10-21."
            runbook_url: {{ ($pr.anthropicDocumentStripped).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.anthropicCitationsStripped).enabled | default true }}
        - alert: DaariAnthropicCitationsStripped
          expr: sum(rate(daari_soft_warnings_total{kind="anthropic_citations_stripped"}[{{ ($pr.anthropicCitationsStripped).window | default "5m" }}])) > {{ ($pr.anthropicCitationsStripped).rateThreshold | default 0 }}
          for: {{ ($pr.anthropicCitationsStripped).for | default "5m" }}
          labels:
            severity: {{ ($pr.anthropicCitationsStripped).severity | default "warning" | quote }}
          annotations:
            summary: "daari Anthropic citations being stripped"
            description: "sum(rate(daari_soft_warnings_total{kind=\"anthropic_citations_stripped\"})) exceeds {{ ($pr.anthropicCitationsStripped).rateThreshold | default 0 }} — citation metadata dropped under anthropic-version 2026-10-21."
            runbook_url: {{ ($pr.anthropicCitationsStripped).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
        {{- if ($pr.anthropicEnforcedProfiles).enabled | default true }}
        - alert: DaariAnthropicEnforcedProfiles
          expr: daari_anthropic_enforced_profiles > {{ ($pr.anthropicEnforcedProfiles).threshold | default 0 }}
          for: {{ ($pr.anthropicEnforcedProfiles).for | default "5m" }}
          labels:
            severity: {{ ($pr.anthropicEnforcedProfiles).severity | default "critical" | quote }}
          annotations:
            summary: "daari Anthropic org enforcement active on mapped profiles"
            description: "daari_anthropic_enforced_profiles is above {{ ($pr.anthropicEnforcedProfiles).threshold | default 0 }} — a mapped end user is restricted or banned."
            runbook_url: {{ ($pr.anthropicEnforcedProfiles).runbookUrl | default "https://github.com/naveenreddyalka/daari/blob/main/docs/developer/guides/observability/metrics-prometheus.md#alert-pack" | quote }}
        {{- end }}
{{- end }}
