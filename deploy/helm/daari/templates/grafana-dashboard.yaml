{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "daari.fullname" . }}-grafana-dashboard
  labels:
    app.kubernetes.io/name: daari
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  daari-dashboard.json: |-
{{ .Files.Get "files/grafana/daari-dashboard.json" | nindent 4 }}
{{- end }}
