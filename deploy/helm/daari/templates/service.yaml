apiVersion: v1
kind: Service
metadata:
  name: {{ include "daari.fullname" . }}
  labels:
    app.kubernetes.io/name: daari
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: daari
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    {{- $metricsPort := int ((.Values.observability).metricsPort | default 0) }}
    {{- if gt $metricsPort 0 }}
    - name: metrics
      port: {{ $metricsPort }}
      targetPort: metrics
    {{- end }}
