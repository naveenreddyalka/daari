apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "daari.fullname" . }}
  labels:
    app.kubernetes.io/name: daari
  {{- if eq (include "daari.fleetSqliteWarning" .) "true" }}
  annotations:
    daari.dev/fleet-sqlite-warning: |
      Effective replicas > 1 with postgres.enabled=false: batches, files,
      virtual keys/teams, and the usage ledger are per-pod SQLite
      (split-brain / 404 / 401 across replicas).
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: daari
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daari
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: daari
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            {{- $metricsPort := int ((.Values.observability).metricsPort | default 0) }}
            {{- if gt $metricsPort 0 }}
            - name: metrics
              containerPort: {{ $metricsPort }}
            {{- end }}
          env:
            - name: DAARI_FLEET_REPLICAS
              value: {{ include "daari.fleetReplicas" . | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if gt $metricsPort 0 }}
            - name: DAARI_OBSERVABILITY__METRICS_PORT
              value: {{ $metricsPort | quote }}
            {{- end }}
            {{- if .Values.redis.enabled }}
            - name: DAARI_CACHE__BACKEND
              value: redis
            - name: DAARI_CACHE__REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: DAARI_OBSERVABILITY__BACKEND
              value: postgres
            - name: DAARI_OBSERVABILITY__POSTGRES_URL
              value: {{ .Values.postgres.url | quote }}
            - name: DAARI_BATCHES__BACKEND
              value: postgres
            - name: DAARI_FILES__BACKEND
              value: postgres
            - name: DAARI_RESPONSES__BACKEND
              value: postgres
            - name: DAARI_ENTERPRISE__AUDIT_BACKEND
              value: postgres
            - name: DAARI_SERVER__VIRTUAL_KEYS__BACKEND
              value: postgres
            {{- end }}
            {{- if .Values.orgPool.enabled }}
            - name: DAARI_ROUTING__ORG_POOL__ENABLED
              value: "true"
            - name: DAARI_ROUTING__ORG_POOL__BASE_URL
              value: {{ .Values.orgPool.baseUrl | quote }}
            {{- end }}
          {{- $preStop := 5 }}
          {{- if and .Values.lifecycle (hasKey .Values.lifecycle "preStopSleepSeconds") }}
          {{- $preStop = int .Values.lifecycle.preStopSleepSeconds }}
          {{- end }}
          {{- if gt $preStop 0 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ $preStop }}"]
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: daari-home
              mountPath: /home/daari/.daari
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: daari-home
          emptyDir: {}
        - name: tmp
          emptyDir: {}