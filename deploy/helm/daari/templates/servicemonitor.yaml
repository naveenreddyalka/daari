{{- if .Values.serviceMonitor.enabled }}
{{- $metricsPort := int ((.Values.observability).metricsPort | default 0) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "daari.fullname" . }}
  labels:
    app.kubernetes.io/name: daari
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: daari
  endpoints:
    {{- if gt $metricsPort 0 }}
    - port: metrics
      path: /metrics
    {{- else }}
    - port: http
      path: /metrics
      {{- with .Values.serviceMonitor.bearerTokenSecret }}
      {{- if and .name .key }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .name }}
          key: {{ .key }}
      {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
